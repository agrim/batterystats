name: BatteryStats
options:
  minimumXcodeGenVersion: 2.39.0

settings:
  base:
    SWIFT_VERSION: 5.0
    ARCHS: arm64
    CURRENT_PROJECT_VERSION: 5
    MARKETING_VERSION: 1.0.4
    DEVELOPMENT_TEAM: Q293G85PG5
    CODE_SIGN_STYLE: Automatic
    CLANG_ENABLE_MODULES: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  BatteryStats:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: BatteryStats
    dependencies:
      - target: BatteryStatsWidgetsExtension
        embed: true
    settings:
      base:
        PRODUCT_NAME: BatteryStats
        PRODUCT_BUNDLE_IDENTIFIER: io.github.agrim.batterystats
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BatteryStats
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        CODE_SIGN_ENTITLEMENTS: BatteryStats/Resources/BatteryStats.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_EMIT_LOC_STRINGS: NO

  BatteryStatsWidgetsExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: BatteryStatsWidgets
      - path: BatteryStats/Features/Battery/Domain/BatteryCalculations.swift
      - path: BatteryStats/Features/Battery/Domain/BatteryFormatting.swift
      - path: BatteryStats/Features/Battery/Domain/BatteryPowerState.swift
      - path: BatteryStats/Features/Battery/Domain/BatterySnapshot.swift
      - path: BatteryStats/Features/Battery/Domain/BatterySnapshot+Preview.swift
      - path: BatteryStats/Features/Battery/Domain/BatteryTelemetrySanitization.swift
      - path: BatteryStats/Features/Battery/Domain/ManufactureDateDecoder.swift
      - path: BatteryStats/Features/Battery/Presentation/BatteryPresentationStyle.swift
      - path: BatteryStats/Settings/TemperatureUnitPreference.swift
      - path: BatteryStats/Shared/Utilities/DateComponentsFormatter+BatteryStats.swift
      - path: BatteryStats/Shared/Widget/BatteryWidgetSnapshotStore.swift
    settings:
      base:
        PRODUCT_NAME: BatteryStatsWidgetsExtension
        PRODUCT_BUNDLE_IDENTIFIER: io.github.agrim.batterystats.widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BatteryStatsWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: BatteryStatsWidgets/BatteryStatsWidgets.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_EMIT_LOC_STRINGS: NO

  BatteryStatsTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/BatteryStatsTests
    dependencies:
      - target: BatteryStats
    settings:
      base:
        PRODUCT_NAME: BatteryStatsTests
        PRODUCT_BUNDLE_IDENTIFIER: io.github.agrim.batterystats.tests
        GENERATE_INFOPLIST_FILE: YES
